[project]
name = "moscowt-backend"
version = "0.1.0"
description = "Reproducible route-hour validation forecasts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "numpy>=2,<3", "pandas>=2.2,<3", "pyarrow>=19,<24", "openpyxl>=3.1,<4",
  "catboost>=1.2.8,<2", "prometheus-client>=0.21,<1",
  "anyio>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "aiohttp>=3.12,<4",
]

[project.scripts]
moscowt = "moscowt.cli:main"

[project.optional-dependencies]
models = [
    "holidays==0.105",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "skops>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moscowt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
