name: moscowt
services:
  app:
    image: moscowt:p0
    build: .
    init: true
    ports:
      - "127.0.0.1:${MOSCOWT_PORT:-8080}:8000"
    volumes:
      - ./dataset:/data/input:ro
      - ./artifacts:/data/state
    cpus: 2.0
    mem_limit: 2g
    restart: unless-stopped
    environment:
      MOSCOWT_QUEUE_LIMIT: 32
      MOSCOWT_CACHE_ENTRIES: 64
      MOSCOWT_CACHE_BYTES: 67108864
